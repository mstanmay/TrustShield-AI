version: "3.9"

# Enterprise Production Overrides: Resource Limits, Security Hardening, and Log Rotation

services:
  api:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M
        reservations:
          cpus: '1.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  qdrant:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  neo4j:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
